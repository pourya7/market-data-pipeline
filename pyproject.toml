[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Robust ETL for Quantitative Research - Multi-source financial data ingestion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Market Data Team" }
]
keywords = ["finance", "market-data", "etl", "quantitative", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "yfinance>=0.2.30",
    "pandera>=0.18",
    "streamlit>=1.29",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
